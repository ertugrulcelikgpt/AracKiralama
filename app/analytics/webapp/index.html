<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Analytics</title>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.153.0/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-async="true"
    data-sap-ui-compat-version="edge"
    data-sap-ui-resource-roots='{ "rentacar.analytics": "./" }'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-frame-options="trusted"
    data-sap-ui-flexibility-services='[{ "connector": "LocalStorageConnector" }]'></script>
  <style>html, body, body > div, #container, #container-uiarea { height: 100%; }</style>
</head>
<body class="sapUiBody sapUiSizeCompact">
  <div data-sap-ui-component data-name="rentacar.analytics" data-id="container" data-height="100%" data-settings='{ "id": "analytics" }'></div>
</body>
</html>
