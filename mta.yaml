_schema-version: 3.3.0
ID: rentacar
version: 1.0.0
description: "SAP CAP ile araç kiralama uygulaması (cap-sflight mimarisinden esinlenilmiştir)"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - npm run build:ui
modules:
  - name: rentacar-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: rentacar-auth
      - name: rentacar-db
      - name: rentacar-destination

  - name: rentacar-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack
    requires:
      - name: rentacar-db

  - name: rentacar
    type: approuter.nodejs
    path: .deploy/app-router
    build-parameters:
      # default-env.json sadece yerel approuter testi içindir (localhost hedefi); buluta gitmez
      ignore: ["default-env.json"]
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: rentacar-auth
      - name: rentacar-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: rentacar-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: rentacar-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: rentacar-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: rentacar-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
