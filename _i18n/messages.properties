# Default error/info messages (English), used via req.error({ message: '<KEY>', args: [...] })

# K1 - dates
RENTAL_DATE_ORDER=The return date must be after the pickup date.
RENTAL_PICKUP_IN_PAST=The pickup date {0} lies in the past.
# K2 - vehicle availability
RENTAL_VEHICLE_NOT_AVAILABLE=Vehicle {0} is already booked from {1} to {2} (rental {3}).
# K3 - vehicle status
RENTAL_VEHICLE_BLOCKED=Vehicle {0} cannot be rented because it is in maintenance or retired.
# K4 - driver eligibility
RENTAL_CUSTOMER_DATA_MISSING=Date of birth and license issue date of the customer are required to check driver eligibility.
RENTAL_DRIVER_TOO_YOUNG=The driver must be at least {0} years old for category {1}; age at pickup: {2}.
RENTAL_LICENSE_TOO_NEW=The driving license must have been held for at least {0} year(s) for category {1}; at pickup: {2}.
# K6 - extras
RENTAL_EXTRA_DUPLICATE=The extra "{0}" has been added more than once.
RENTAL_EXTRA_QUANTITY=The quantity of an extra must be between 1 and 3.
# K7 - edit lock
RENTAL_NOT_EDITABLE=Only open rentals can be edited.
# Actions
ACTION_ONLY_ACTIVE=Actions can only be executed on saved rentals, not on drafts.
APPROVE_NOT_OPEN=Only open rentals can be approved.
REJECT_NOT_OPEN=Only open rentals can be rejected.
REJECT_REASON_REQUIRED=Please enter a reason for the rejection.
COMPLETE_NOT_APPROVED=Only approved rentals can be completed.
COMPLETE_KM_INVALID=The return mileage {0} km must not be lower than the vehicle mileage {1} km.
CANCEL_NOT_ALLOWED=Only open or approved rentals can be canceled.
DISCOUNT_NOT_OPEN=Discounts can only be applied to open rentals.
DISCOUNT_PERCENT_INVALID=The discount must be between 1 and 30 percent.
DISCOUNT_CAPPED=The total discount is limited to 30%; a manager discount of {0}% was applied.
# Master data (AdminService)
VEHICLE_IN_USE=Vehicle {0} is used in rentals and cannot be deleted. Set its status to "Retired" instead.
BRANCH_IN_USE=Branch {0} is used in rentals or vehicles and cannot be deleted.
EXTRA_IN_USE=Extra {0} is used in rentals and cannot be deleted.
# S/4HANA Business Partner integration
S4_UNREACHABLE=The S/4HANA system cannot be reached at the moment (timeout or connection error). Please try again later.
S4_UNAUTHORIZED=Access to S/4HANA was denied (401/403). Check the API key or the destination configuration.
S4_ERROR=The S/4HANA system returned an error (status {0}).
S4_BP_NOT_FOUND=Business partner {0} was not found in S/4HANA.
S4_BP_NOT_PERSON=Business partner {0} is an organization; only persons can be imported as customers.
