# Hata/bilgi mesajları (Türkçe), req.error({ message: '<ANAHTAR>', args: [...] }) ile kullanılır

# K1 - tarihler
RENTAL_DATE_ORDER=İade tarihi teslim tarihinden sonra olmalıdır.
RENTAL_PICKUP_IN_PAST=Teslim tarihi {0} geçmişte kalıyor.
# K2 - araç müsaitliği
RENTAL_VEHICLE_NOT_AVAILABLE={0} plakalı araç {1} - {2} tarihleri arasında zaten kiralanmış ({3} numaralı kiralama).
# K3 - araç durumu
RENTAL_VEHICLE_BLOCKED={0} plakalı araç bakımda veya hizmet dışı olduğu için kiralanamaz.
# K4 - sürücü uygunluğu
RENTAL_CUSTOMER_DATA_MISSING=Sürücü uygunluğunun kontrolü için müşterinin doğum tarihi ve ehliyet veriliş tarihi gereklidir.
RENTAL_DRIVER_TOO_YOUNG={1} kategorisi için sürücü en az {0} yaşında olmalıdır; teslim tarihindeki yaş: {2}.
RENTAL_LICENSE_TOO_NEW={1} kategorisi için ehliyet en az {0} yıllık olmalıdır; teslim tarihinde: {2} yıl.
# K6 - ek hizmetler
RENTAL_EXTRA_DUPLICATE="{0}" ek hizmeti birden fazla kez eklenmiş.
RENTAL_EXTRA_QUANTITY=Ek hizmet adedi 1 ile 3 arasında olmalıdır.
# K7 - düzenleme kilidi
RENTAL_NOT_EDITABLE=Sadece açık durumdaki kiralamalar düzenlenebilir.
# Action'lar
ACTION_ONLY_ACTIVE=İşlemler taslaklarda değil, yalnızca kaydedilmiş kiralamalarda yapılabilir.
APPROVE_NOT_OPEN=Sadece açık durumdaki kiralamalar onaylanabilir.
REJECT_NOT_OPEN=Sadece açık durumdaki kiralamalar reddedilebilir.
REJECT_REASON_REQUIRED=Lütfen red sebebini girin.
COMPLETE_NOT_APPROVED=Sadece onaylanmış kiralamalar tamamlanabilir.
COMPLETE_KM_INVALID=İade kilometresi ({0} km) aracın mevcut kilometresinden ({1} km) düşük olamaz.
CANCEL_NOT_ALLOWED=Sadece açık veya onaylanmış kiralamalar iptal edilebilir.
DISCOUNT_NOT_OPEN=İndirim sadece açık durumdaki kiralamalara uygulanabilir.
DISCOUNT_PERCENT_INVALID=İndirim oranı 1 ile 30 arasında olmalıdır.
DISCOUNT_CAPPED=Toplam indirim en fazla %30 olabilir; %{0} yönetici indirimi uygulandı.

# Ana veriler (AdminService)
VEHICLE_IN_USE={0} plakalı araç kiralamalarda kullanıldığı için silinemez. Bunun yerine durumunu "Hizmet dışı" yapın.
BRANCH_IN_USE={0} şubesi kiralamalarda veya araçlarda kullanıldığı için silinemez.
EXTRA_IN_USE={0} ek hizmeti kiralamalarda kullanıldığı için silinemez.

# S/4HANA Business Partner entegrasyonu
S4_UNREACHABLE=S/4HANA sistemine şu anda ulaşılamıyor (zaman aşımı veya bağlantı hatası). Lütfen daha sonra tekrar deneyin.
S4_UNAUTHORIZED=S/4HANA erişimi reddedildi (401/403). API anahtarını veya destination ayarını kontrol edin.
S4_ERROR=S/4HANA sistemi bir hata döndürdü (durum {0}).
S4_BP_NOT_FOUND={0} numaralı iş ortağı S/4HANA'da bulunamadı.
S4_BP_NOT_PERSON={0} numaralı iş ortağı bir kurum; müşteri olarak sadece kişiler aktarılabilir.

# Yetki: CAP'in Türkçe dosyasında bu iki mesaj çevrilmemiş, burada çeviriyoruz
401=Lütfen giriş yapın.
403=Bu işlem için yetkiniz yok.
S4_NOT_CONFIGURED=S/4HANA bağlantısı yapılandırılmamış (API_BUSINESS_PARTNER destination'ı bulunamadı). BTP cockpit'teki destination'ı ve Destination servisi bağlantısını kontrol edin.
